[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-radar"
version = "0.1.0"
description = "AI-assisted event discovery for small communities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
